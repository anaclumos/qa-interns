assert_lefthook_installed: true

pre-push:
  piped: true
  jobs:
    - name: clean tree
      run: git status --short && test -z "$(git status --porcelain)"
    - name: docker
      run: docker info > /dev/null
    - name: install
      run: bun install --frozen-lockfile
    - name: typecheck
      run: bun run typecheck
    - name: plugin validate
      run: bunx @anthropic-ai/claude-code@2.1.283 plugin validate . && bunx @anthropic-ai/claude-code@2.1.283 plugin validate skills
    - name: test
      run: unset $(git rev-parse --local-env-vars) && bun test --timeout 1200000
