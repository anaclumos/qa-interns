services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["bun", "run", "src/server.ts"]
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "3000:3000"
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
